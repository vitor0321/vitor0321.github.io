
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abrir no Join Play</title>
<style>
  :root {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 32px 24px;
    text-align: center;
    background: radial-gradient(circle at 50% 0%, #10182b 0%, #060a12 70%);
    color: #f2f2f2;
  }
  .logo {
    width: 96px;
    height: 96px;
    border-radius: 24px;
    box-shadow: 0 12px 32px rgba(255, 140, 0, 0.25);
    animation: pop 600ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .wordmark {
    margin: 20px 0 4px;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .wordmark .join { color: #ffffff; }
  .wordmark .play {
    background: linear-gradient(90deg, #ff7a1a, #ffc233);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .spinner {
    width: 28px;
    height: 28px;
    margin: 20px 0 4px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: #ff9a2e;
    animation: spin 800ms linear infinite;
  }
  p#message {
    max-width: 300px;
    line-height: 1.5;
    color: #c7cbd6;
    font-size: 15px;
  }
  a.button {
    display: none;
    margin-top: 12px;
    padding: 14px 28px;
    border-radius: 999px;
    background: linear-gradient(90deg, #ff7a1a, #ffc233);
    color: #12100a;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 8px 20px rgba(255, 140, 0, 0.3);
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>

  <p class="wordmark"><span class="join">Join</span> <span class="play">Play</span></p>

  <div id="spinner" class="spinner"></div>
  <p id="message">Abrindo a partida…</p>
  <a id="fallback" class="button" href="#">Baixar o app</a>

  <script>
    // Preencher assim que o app for publicado na App Store:
    // App Store Connect > seu app > App Information > Apple ID (só o número).
    var IOS_APP_STORE_ID = "";
    var ANDROID_PACKAGE = "com.walcker.match.app";

    var params = new URLSearchParams(window.location.search);
    var matchId = params.get("id");
    var message = document.getElementById("message");
    var fallback = document.getElementById("fallback");
    var spinner = document.getElementById("spinner");

    function stopSpinning() {
      spinner.style.display = "none";
    }

    if (!matchId) {
      stopSpinning();
      message.textContent = "Link de partida inválido.";
    } else {
      var appLink = "joinplay://match/" + encodeURIComponent(matchId);
      var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      var isAndroid = /Android/i.test(navigator.userAgent);

      var storeUrl = null;
      if (isAndroid) {
        storeUrl = "https://play.google.com/store/apps/details?id=" + ANDROID_PACKAGE;
      } else if (isIOS && IOS_APP_STORE_ID) {
        storeUrl = "https://apps.apple.com/app/id" + IOS_APP_STORE_ID;
      }

      var appOpened = false;
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) appOpened = true;
      });
      window.addEventListener("pagehide", function () {
        appOpened = true;
      });

      window.setTimeout(function () {
        if (appOpened || document.hidden) return;

        stopSpinning();
        if (storeUrl) {
          message.textContent = "Não encontramos o Join Play instalado. Te levando pra loja…";
          fallback.href = storeUrl;
          fallback.style.display = "inline-block";
          window.location.replace(storeUrl);
        } else if (isIOS || isAndroid) {
          message.textContent = "O app Join Play ainda não está disponível para download. Tente de novo mais tarde.";
        } else {
          message.textContent = "Abra este link no seu celular para entrar na partida.";
        }
      }, 1500);

      window.location.href = appLink;
    }
  </script>
